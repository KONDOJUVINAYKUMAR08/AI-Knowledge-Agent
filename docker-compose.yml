services:
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: knowledge-agent-mcp-server
    environment:
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - JIRA_PROVIDER=${JIRA_PROVIDER:-mock}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  knowledge-agent:
    build:
      context: ./knowledge-agent
      dockerfile: Dockerfile
    container_name: knowledge-agent-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-["http://localhost:5173"]}
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-45}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_RETRY_BACKOFF_SECONDS=${LLM_RETRY_BACKOFF_SECONDS:-0.5}
      - AGENT_TOOL_TIMEOUT_SECONDS=${AGENT_TOOL_TIMEOUT_SECONDS:-30}
      - AGENT_QUERY_TIMEOUT_SECONDS=${AGENT_QUERY_TIMEOUT_SECONDS:-90}
    depends_on:
      - mcp-server
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-agent-ui
    ports:
      - "80:80"
    depends_on:
      - knowledge-agent
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
